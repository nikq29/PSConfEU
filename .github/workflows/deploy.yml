name: Azure Function App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Azure Function
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/azure-powershell:mariner-2
    steps:
      - uses: actions/checkout@v4
      - name: Install modules and build zip
        run: |
          pwsh ./azure-function/Modules/installModules.ps1
          tdnf install zip -y
          mkdir dist
          cd ./azure-function
          zip -r ../dist/azure-function.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: azure-function-zip
          path: dist/azure-function.zip

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-function-zip
          path: dist/
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set App Settings
        env:
          ARM_AZFUNC_NAME: ${{ vars.AZURE_AZFUNC_NAME }}
          ARM_AZFUNC_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az functionapp config appsettings set \
            --name $ARM_AZFUNC_NAME \
            --resource-group $ARM_AZFUNC_RESOURCE_GROUP \
            --settings \
              CI_COMMIT_SHORT_SHA="${GITHUB_SHA::8}" \
              CI_COMMIT_REF_NAME="${{ github.ref_name }}" \
              CI_JOB_ID="${{ github.run_id }}" \
              CI_PROJECT_NAME="${{ github.event.repository.name }}" \
              GITHUB_ACTOR="${{ github.actor }}" \
              CI_JOB_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Deploy Function Code
        env:
          ARM_AZFUNC_NAME: ${{ vars.AZURE_AZFUNC_NAME }}
          ARM_AZFUNC_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az functionapp deployment source config-zip \
            --name $ARM_AZFUNC_NAME \
            --resource-group $ARM_AZFUNC_RESOURCE_GROUP \
            --src dist/azure-function.zip
